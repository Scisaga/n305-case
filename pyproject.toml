[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "n305-half-open-case"
version = "0.2.0"
description = "Photo-traced references and future three-part enclosure project for the N305"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery==2.8.0",
    "matplotlib>=3.8,<4",
    "numpy>=2,<3",
    "Pillow>=10,<13",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["n305_mainboard_reference", "n305_panel_reference", "n305_photo_reference"]
